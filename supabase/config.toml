# Supabase Configuration for Rahal (رحال)
# https://supabase.com/docs/guides/cli/config

[api]
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure.
max_rows = 1000

[db]
# Port to use for the local database URL.
port = 54322
# The database major version to use.
major_version = 15

[studio]
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://localhost"

# Email testing server.
[inbucket]
# Port to use for the email testing server web interface.
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

[auth]
# The base URL of your website.
site_url = "http://localhost:3000"
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
additional_redirect_urls = ["https://localhost:3000", "http://localhost:3000/ar", "http://localhost:3000/en"]
# How long tokens are valid for, in seconds.
jwt_expiry = 3600
# Allow/disallow new user signups to your project.
enable_signup = true

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = true
# If enabled, users need to confirm their email address before signing in.
double_confirm_changes = true
# If enabled, users will need to confirm any email change on both the old, and new email addresses.
enable_confirmations = false

[auth.sms]
# Allow/disallow new user signups via SMS.
enable_signup = false
enable_confirmations = false

# External OAuth providers
[auth.external.google]
enabled = false
client_id = ""
secret = ""

[auth.external.apple]
enabled = false
client_id = ""
secret = ""

[analytics]
enabled = false
port = 54327
vector_port = 54328
# Configure backend for analytics
backend = "postgres"

# Local Development Settings
[local]
# Whether to enable local development mode
enabled = true
